  /health/:
    get:
      tags:
        - health
      description: Returns the health status of the Fee Catalog service
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - timestamp
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
  /fee-structures/:
    post:
      tags:
        - fee-structures
      description: Creates a new fee structure (course + category + batch) together
        with its first ACTIVE version, terms, and one-time costs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - categoryId
                - batchId
                - name
                - lateFeePerDay
                - terms
              properties:
                courseId:
                  minimum: 1
                  type: integer
                categoryId:
                  minimum: 1
                  type: integer
                batchId:
                  minimum: 1
                  type: integer
                name:
                  minLength: 1
                  type: string
                lateFeePerDay:
                  minimum: 0
                  type: integer
                paymentWindowOffsetDays:
                  minimum: 0
                  description: Required if any term is missing dueDate or paymentWindowOpenDate.
                  type: integer
                dueDateOffsetDays:
                  minimum: 0
                  description: Required if any term is missing dueDate or paymentWindowOpenDate.
                  type: integer
                terms:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    required:
                      - startDate
                      - endDate
                      - components
                    properties:
                      startDate:
                        description: ISO 8601 date (YYYY-MM-DD)
                        type: string
                      endDate:
                        description: ISO 8601 date (YYYY-MM-DD)
                        type: string
                      dueDate:
                        description: ISO 8601 date (YYYY-MM-DD)
                        type: string
                      paymentWindowOpenDate:
                        description: ISO 8601 date (YYYY-MM-DD)
                        type: string
                      components:
                        minItems: 1
                        type: array
                        items:
                          type: object
                          required:
                            - name
                            - amount
                          properties:
                            name:
                              minLength: 1
                              type: string
                            amount:
                              minimum: 0
                              description: Amount in the smallest currency unit (e.g. paise/cents).
                              type: integer
                oneTimeCosts:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - amount
                    properties:
                      name:
                        minLength: 1
                        type: string
                      amount:
                        minimum: 0
                        type: integer
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - type
                      - id
                      - attributes
                    properties:
                      type:
                        type: string
                        enum:
                          - fee-structures
                      id:
                        type: string
                      attributes:
                        type: object
                        required:
                          - courseId
                          - categoryId
                          - batchId
                          - lineageId
                          - versionId
                          - version
                          - name
                          - status
                          - lateFeePerDay
                          - paymentWindowOffsetDays
                          - dueDateOffsetDays
                          - createdAt
                          - terms
                          - oneTimeCosts
                        properties:
                          courseId:
                            type: integer
                          categoryId:
                            type: integer
                          batchId:
                            type: integer
                          lineageId:
                            description: Stable id shared by every version of this fee structure
                            type: string
                          versionId:
                            description: id of this specific version
                            type: string
                          version:
                            description: Sequential version number within the lineage
                            type: integer
                          name:
                            type: string
                          status:
                            anyOf:
                              - type: string
                                enum:
                                  - DRAFT
                              - type: string
                                enum:
                                  - ACTIVE
                              - type: string
                                enum:
                                  - SUPERSEDED
                          lateFeePerDay:
                            type: integer
                          paymentWindowOffsetDays:
                            type: integer
                          dueDateOffsetDays:
                            type: integer
                          createdAt:
                            description: ISO 8601 date-time
                            type: string
                          terms:
                            type: array
                            items:
                              type: object
                              required:
                                - startDate
                                - endDate
                                - dueDate
                                - paymentWindowOpenDate
                                - components
                              properties:
                                startDate:
                                  type: string
                                endDate:
                                  type: string
                                dueDate:
                                  type: string
                                paymentWindowOpenDate:
                                  type: string
                                components:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - name
                                      - amount
                                    properties:
                                      name:
                                        type: string
                                      amount:
                                        type: integer
                          oneTimeCosts:
                            type: array
                            items:
                              type: object
                              required:
                                - name
                                - amount
                              properties:
                                name:
                                  type: string
                                amount:
                                  type: integer
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - status
                        - code
                        - title
                        - detail
                      properties:
                        status:
                          description: HTTP status code, as a string
                          type: string
                        code:
                          description: Machine-readable domain error code
                          type: string
                        title:
                          description: Short, human-readable error name
                          type: string
                        detail:
                          description: Human-readable explanation specific to this error
                          type: string
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - status
                        - code
                        - title
                        - detail
                      properties:
                        status:
                          description: HTTP status code, as a string
                          type: string
                        code:
                          description: Machine-readable domain error code
                          type: string
                        title:
                          description: Short, human-readable error name
                          type: string
                        detail:
                          description: Human-readable explanation specific to this error
                          type: string
