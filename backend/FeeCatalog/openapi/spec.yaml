        - categories
      description: Creates a new category (quota / seat type).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 1
                  type: string
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - type
                      - id
                      - attributes
                    properties:
                      type:
                        type: string
                        enum:
                          - categories
                      id:
                        type: string
                      attributes:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - status
                        - code
                        - title
                        - detail
                      properties:
                        status:
                          description: HTTP status code, as a string
                          type: string
                        code:
                          description: Machine-readable domain error code
                          type: string
                        title:
                          description: Short, human-readable error name
                          type: string
                        detail:
                          description: Human-readable explanation specific to this error
                          type: string
    get:
      tags:
        - categories
      description: Returns every category, ordered by name.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - id
                        - attributes
                      properties:
                        type:
                          type: string
                          enum:
                            - categories
                        id:
                          type: string
                        attributes:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
  /categories/{id}:
    get:
      tags:
        - categories
      description: Returns a single category by id.
      parameters:
