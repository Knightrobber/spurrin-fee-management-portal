                        detail:
                          description: Human-readable explanation specific to this error
                          type: string
    get:
      tags:
        - batches
      description: Returns every batch, ordered by start date descending (newest
        intake first).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
