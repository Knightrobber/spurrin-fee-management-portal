  /batches/:
    post:
      tags:
        - batches
      description: Creates a new batch (intake cohort for a course in an admission year).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - startDate
                - endDate
              properties:
                name:
                  minLength: 1
                  type: string
                startDate:
                  format: date
                  description: ISO 8601 date (YYYY-MM-DD)
                  type: string
                endDate:
                  format: date
                  description: ISO 8601 date (YYYY-MM-DD)
                  type: string
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - type
                      - id
                      - attributes
                    properties:
                      type:
                        type: string
                        enum:
                          - batches
                      id:
                        type: string
                      attributes:
                        type: object
                        required:
                          - name
                          - startDate
                          - endDate
                        properties:
                          name:
                            type: string
                          startDate:
                            description: ISO 8601 date (YYYY-MM-DD)
                            type: string
                          endDate:
                            description: ISO 8601 date (YYYY-MM-DD)
