  /searches/page:
    get:
      tags:
        - searches
      description: "Runs a faceted search over fee structures: returns the matching
        results (as relationships/included resources), the available filter
        options (facets), and the total match count. Only page[size] is honoured
        — this endpoint is not offset-paginated."
      parameters:
        - schema:
            type: string
          in: query
          name: filter[searchTerm]
          required: false
          description: Free-text, partial (case-insensitive) match against the fee
            structure name.
        - schema:
            minimum: 1
            type: integer
          in: query
          name: filter[courseId]
