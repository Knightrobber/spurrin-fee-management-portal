  /courses/:
    post:
      tags:
        - courses
      description: Creates a new course (academic program).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - durationYears
              properties:
                name:
                  minLength: 1
                  type: string
                durationYears:
                  exclusiveMinimum: 0
